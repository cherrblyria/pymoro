<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pymoro</title>
    <link href="./output.css" rel="stylesheet" />
  </head>

  <body>
    <div class="app bg-ctp-crust flex flex-col font-sans gap-2 h-screen p-2">
      <div
        id="session"
        class="bg-ctp-surface0 flex font-bold px-6 py-1 rounded-full self-center shadow-xl text-[1em] text-ctp-text text-shadow-lg"
      ></div>

      <div
        id="timer"
        class="bg-ctp-surface0 flex flex-1 font-black items-center justify-center rounded-2xl shadow-xl text-[3.1em] text-ctp-text text-shadow-lg"
      ></div>

      <div id="control" class="gap-1 grid grid-cols-3 text-[1.2em]">
        <button
          id="start"
          onclick="main('start')"
          class="bg-ctp-green rounded-full shadow-xl text-shadow-lg"
        >
          Start
        </button>

        <button
          id="stop"
          onclick="main('stop')"
          hidden
          class="bg-ctp-yellow rounded-full shadow-xl text-shadow-lg"
        >
          Stop
        </button>

        <button
          id="skip"
          onclick="main('skip')"
          class="bg-ctp-blue rounded-full shadow-xl text-shadow-lg"
        >
          Skip
        </button>

        <button
          id="reset"
          onclick="main('reset')"
          class="bg-ctp-red rounded-full shadow-xl text-shadow-lg"
        >
          Reset
        </button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
