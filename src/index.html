<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pymoro</title>
    <link href="./app.css" rel="stylesheet" />
  </head>

  <body>
    <div class="app gap-2 bg-gray-900 p-2 font-sans flex h-screen flex-col">
      <div class="grid grid-flow-col">
        <div
          id="session"
          class="bg-gray-600 px-2 py-1 font-bold text-gray-50 shadow-xl text-shadow-lg absolute justify-self-center rounded-full text-[1em]"
        ></div>
        <div
          id="round"
          class="bg-gray-600 px-3 py-1 font-bold text-gray-50 shadow-xl text-shadow-lg justify-self-end rounded-full text-[1em]"
        ></div>
      </div>

      <div
        id="timer"
        class="rounded-2xl bg-gray-600 font-black text-gray-50 shadow-xl text-shadow-lg flex flex-1 items-center justify-center text-[3.1em]"
      ></div>

      <div class="gap-1 grid grid-flow-col justify-items-stretch text-[1.2em]">
        <button
          id="start"
          onclick="main('start')"
          class="bg-green-300 text-green-900 shadow-xl text-shadow-lg hover:bg-green-200 rounded-full"
        >
          Start
        </button>

        <button
          id="stop"
          onclick="main('stop')"
          hidden
          class="bg-yellow-300 text-yellow-900 shadow-xl text-shadow-lg hover:bg-yellow-200 rounded-full"
        >
          Stop
        </button>

        <button
          id="skip"
          onclick="main('skip')"
          hidden
          class="bg-blue-300 text-blue-900 shadow-xl text-shadow-lg hover:bg-blue-200 rounded-full"
        >
          Skip
        </button>

        <button
          id="reset"
          onclick="main('reset')"
          hidden
          class="bg-red-300 text-red-900 shadow-xl text-shadow-lg hover:bg-red-200 rounded-full"
        >
          Reset
        </button>
      </div>
    </div>

    <audio id="notif">
      <source src="../assets/notif.mp3" type="audio/mpeg" />
    </audio>

    <script src="./script.js"></script>
  </body>
</html>
